<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CashConnect — Log In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_back" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</head>

<body class="bg-gray-50 min-h-screen">

    <button onclick="backPopup()"
        class="fixed top-4 left-4 z-20 flex items-center gap-1.5 text-sm text-gray-600 hover:text-gray-900 bg-white border border-gray-200 rounded-full px-3 py-1.5 shadow-sm transition">
        <span class="material-symbols-outlined text-[18px]">arrow_back</span>
        Back
    </button>

    <div id="login" class="min-h-screen flex items-center justify-center p-4 sm:p-8">

        <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-gray-100 p-7 sm:p-10">

            <div class="mb-6">
                <span class="font-mono text-xs tracking-widest text-gray-400">ACCOUNT ACCESS</span>
                <h2 class="font-bold text-2xl mt-1 text-gray-900">Welcome back</h2>
                <p class="text-gray-500 text-sm mt-1">Grow your network and build financial trust.</p>
            </div>

            <div class="flex items-center gap-2 mb-3">
                <h3 class="text-sm font-semibold text-gray-700">Sign in</h3>
                <div class="h-px flex-1 bg-gray-100"></div>
            </div>

            <div class="grid grid-cols-1 gap-4 mb-2" id="inputDetails">
                <input id="lemail" type="email" placeholder="Email address"
                    class="w-full border border-gray-300 rounded-lg p-3 text-sm outline-none focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600 transition">
                <input id="lpassword" type="password" placeholder="Password"
                    class="w-full border border-gray-300 rounded-lg p-3 text-sm outline-none focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600 transition">
            </div>

            <button onclick="loginPage()"
                class="w-full mt-6 py-3.5 rounded-xl bg-emerald-700 text-white font-semibold text-[15px] tracking-wide hover:bg-emerald-800 active:scale-[0.99] transition duration-150 shadow-md">
                Log in
            </button>

            <p class="text-center text-gray-500 text-sm mt-4">
                Don't have a CashConnect account?
                <a href="../pages/signup.html" class="text-emerald-700 font-medium hover:underline">Create one</a>
            </p>
        </div>
    </div>

    <!-- Alert -->
    <div id="alertBox" class="hidden fixed inset-0 bg-gray-900/50 flex items-center justify-center z-40 p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-7 w-80 text-center">
            
            <h2 class="text-lg font-semibold text-gray-900">Sign in issue</h2>
            <p class="mt-1.5 text-gray-500 text-sm">Please fill all fields.</p>
            <button onclick="closeAlert()"
                class="mt-5 w-full bg-emerald-700 text-white font-medium py-2.5 rounded-lg hover:bg-emerald-800 transition">
                OK
            </button>
        </div>
    </div>

    <!-- Loader -->
    <div id="loader" class="hidden fixed inset-0 bg-gray-900/90 flex items-center justify-center z-50">
        <div class="text-center px-6">
            <div class="mx-auto w-16 h-16 border-[3px] border-white/15 border-t-amber-400 rounded-full animate-spin"></div>
            <h2 class="text-2xl font-bold text-white mt-7">Verifying account</h2>
            <p class="text-white/60 mt-1">Welcome, <span id="loaderName" class="text-white font-medium"></span></p>
            <p id="status" class="font-mono text-xs tracking-widest text-amber-400 mt-3"></p>
        </div>
    </div>

    <script>
        let userEmail = "";
        let userNumber = "";

        function loginPage() {

            let email = document.getElementById("lemail").value;
            let password = document.getElementById("lpassword").value
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            let alertBox = document.getElementById("alertBox")
            let pTag = alertBox.querySelector("p");
            let messages = [
                "Preparing your dashboard...",
                "Loading your profile...",
                "Connecting securely...",
                "Almost there..."
            ]



            if (email == "" || password == "") {
                showAlert();
                return
            }
            else if (!emailPattern.test(email) || !email.includes("@") || !email.endsWith(".com")) {
                Toastify({
                    text: "Please Enter valid Email",
                    duration: 1000,
                    gravity: "bottom",
                    position: "center",
                    backgroundColor: "#f59e0b"
                }).showToast();
            }



            else if (password.length <= 8) {
                Toastify({
                    text: "Password must be at least 8 characters long",
                    duration: 1000,
                    gravity: "bottom",
                    position: "center",
                    backgroundColor: "#f59e0b"
                }).showToast();
            }
            else {
                let userDb = JSON.parse(localStorage.getItem("users")) || [];
                let user = userDb.find(e => e.email === email)


                if (user) {
                    if (user.password === password) {
                        localStorage.setItem("loggedInUser", JSON.stringify(user));
                        document.getElementById("loader").classList.remove("hidden");
                        document.getElementById("loaderName").innerText = user.name;
                        let i = 0;

                        localStorage.setItem("loggedInUser", JSON.stringify(user));
                        let interval = setInterval(() => {
                            document.getElementById("status").innerText = messages[i % messages.length];
                            i++
                        }, 700)
                        setTimeout(() => {
                            clearInterval(interval)
                            window.location.href = "dashboard.html"
                        }, 3000)
                    }
                    else {
                        Toastify({
                            text: "Incorrect Password",
                            duration: 1000,
                            gravity: "bottom",
                            position: "center",
                            backgroundColor: "#f59e0b"
                        }).showToast();
                    }
                }
                else {
                    alertBox.classList.remove("hidden")
                    pTag.innerHTML = "Account not found. Or Please check your email ."
                }

            }
        }


        const backPopup = () => {
            window.history.back();
        }


        function showAlert() {
            alertBox.classList.remove("hidden")
        }

        function closeAlert() {
            alertBox.classList.add("hidden");

        }

    </script>
</body>

</html>
